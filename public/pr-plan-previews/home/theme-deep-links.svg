<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">One page, a theme in every link</title>
  <desc id="desc">Wireframe of the home page. The theme-picker pill, reachable via ?theme=light, is highlighted in blue.</desc>
  <rect width="640" height="360" fill="#ffffff"/>

  <rect x="0" y="0" width="640" height="20" fill="#e5e7eb"/>
  <rect x="48" y="5" width="90" height="10" rx="2" fill="#d1d5db"/>
  <rect x="142" y="5" width="90" height="10" rx="2" fill="#2563eb"/>

  <rect x="220" y="90" width="200" height="16" rx="2" fill="#d1d5db"/>
  <rect x="190" y="116" width="260" height="8" rx="2" fill="#e5e7eb"/>
  <rect x="210" y="130" width="220" height="8" rx="2" fill="#e5e7eb"/>
  <rect x="270" y="150" width="100" height="22" rx="4" fill="#e5e7eb"/>

  <g>
    <rect x="466" y="42" width="134" height="36" fill="#2563eb" fill-opacity=".1" stroke="#2563eb" stroke-width="2"/>
    <rect x="470" y="46" width="28" height="28" fill="#2563eb"/>
    <rect x="501" y="46" width="28" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="532" y="46" width="28" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="563" y="46" width="28" height="28" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  </g>
</svg>
